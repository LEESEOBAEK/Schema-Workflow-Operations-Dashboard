<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Schema Workflow 기술 흐름</title>
  <desc id="desc">사용자 요청이 실행 명세, 작업 계약, AI CLI, Python Workflow Engine, 근거와 산출물, 사용자 검토로 이어지는 전체 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18342c" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71817b"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; fill: #1d2925; letter-spacing: 0; }
      .eyebrow { font-size: 16px; font-weight: 700; fill: #4f6d62; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 17px; fill: #62716c; }
      .step { font-size: 13px; font-weight: 800; }
      .card-title { font-size: 22px; font-weight: 800; }
      .card-subtitle { font-size: 14px; fill: #6b7874; }
      .item { font-size: 15px; font-weight: 650; }
      .item-note { font-size: 12px; fill: #74817d; }
      .arrow-label { font-size: 12px; font-weight: 750; fill: #66756f; }
      .band-label { font-size: 13px; font-weight: 800; }
      .band-copy { font-size: 13px; fill: #5f6d68; }
      .badge { font-size: 13px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f3f6f5"/>
  <rect x="0" y="0" width="1600" height="10" fill="#1f7254"/>

  <text x="70" y="64" class="eyebrow">SCHEMA WORKFLOW OPERATIONS DASHBOARD</text>
  <text x="70" y="112" class="title">AI 작업이 검증 가능한 기록이 되기까지</text>
  <text x="70" y="148" class="subtitle">해석과 생성은 AI가 맡고, 관계·근거·완료 조건은 계약과 검증 계층이 지킵니다.</text>
  <rect x="1390" y="52" width="140" height="38" rx="7" fill="#173d34"/>
  <text x="1460" y="76" text-anchor="middle" class="badge">STABLE 1.0.6</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="210" width="260" height="315" rx="8" fill="#ffffff" stroke="#cbd9d4"/>
  </g>
  <rect x="55" y="210" width="260" height="8" rx="4" fill="#277156"/>
  <circle cx="92" cy="257" r="19" fill="#e5f2ed"/>
  <text x="92" y="262" text-anchor="middle" class="step" fill="#277156">01</text>
  <text x="122" y="254" class="card-title">요청과 템플릿</text>
  <text x="122" y="277" class="card-subtitle">Intent &amp; Execution Template</text>
  <line x1="80" y1="300" x2="290" y2="300" stroke="#e2e8e5"/>
  <circle cx="87" cy="332" r="5" fill="#277156"/>
  <text x="103" y="338" class="item">현재 상황과 목표</text>
  <text x="103" y="360" class="item-note">무엇을 왜 해결하는지 기록</text>
  <circle cx="87" cy="397" r="5" fill="#277156"/>
  <text x="103" y="403" class="item">실행 템플릿 선택</text>
  <text x="103" y="425" class="item-note">시작·기능 추가·유지보수·검토</text>
  <circle cx="87" cy="462" r="5" fill="#277156"/>
  <text x="103" y="468" class="item">원문 무결성 보존</text>
  <text x="103" y="490" class="item-note">UTF-8 파일과 SHA-256</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="365" y="210" width="260" height="315" rx="8" fill="#ffffff" stroke="#ded5c7"/>
  </g>
  <rect x="365" y="210" width="260" height="8" rx="4" fill="#a7671f"/>
  <circle cx="402" cy="257" r="19" fill="#fbefdd"/>
  <text x="402" y="262" text-anchor="middle" class="step" fill="#985c19">02</text>
  <text x="432" y="254" class="card-title">작업 계약</text>
  <text x="432" y="277" class="card-subtitle">Session &amp; Operation</text>
  <line x1="390" y1="300" x2="600" y2="300" stroke="#e8e2d9"/>
  <circle cx="397" cy="332" r="5" fill="#a7671f"/>
  <text x="413" y="338" class="item">WorkSession 생성</text>
  <text x="413" y="360" class="item-note">사용자가 이해하는 작업 단위</text>
  <circle cx="397" cy="397" r="5" fill="#a7671f"/>
  <text x="413" y="403" class="item">OperationId 고정</text>
  <text x="413" y="425" class="item-note">대시보드와 Run의 연결 키</text>
  <circle cx="397" cy="462" r="5" fill="#a7671f"/>
  <text x="413" y="468" class="item">관계 정책 확정</text>
  <text x="413" y="490" class="item-note">독립·이어가기·분기 계약</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="675" y="210" width="260" height="315" rx="8" fill="#ffffff" stroke="#cbd9e2"/>
  </g>
  <rect x="675" y="210" width="260" height="8" rx="4" fill="#397898"/>
  <circle cx="712" cy="257" r="19" fill="#e5f0f5"/>
  <text x="712" y="262" text-anchor="middle" class="step" fill="#397898">03</text>
  <text x="742" y="254" class="card-title">외부 AI CLI</text>
  <text x="742" y="277" class="card-subtitle">Agent Execution</text>
  <line x1="700" y1="300" x2="910" y2="300" stroke="#e1e8ec"/>
  <circle cx="707" cy="332" r="5" fill="#397898"/>
  <text x="723" y="338" class="item">Codex</text>
  <text x="723" y="360" class="item-note">프로젝트 코드와 산출물 작업</text>
  <circle cx="707" cy="397" r="5" fill="#397898"/>
  <text x="723" y="403" class="item">Claude Code</text>
  <text x="723" y="425" class="item-note">외부 세션에서 동일 계약 사용</text>
  <circle cx="707" cy="462" r="5" fill="#397898"/>
  <text x="723" y="468" class="item">Antigravity</text>
  <text x="723" y="490" class="item-note">플랫폼과 Engine 책임 분리</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="985" y="210" width="260" height="315" rx="8" fill="#ffffff" stroke="#c8d8d4"/>
  </g>
  <rect x="985" y="210" width="260" height="8" rx="4" fill="#247b72"/>
  <circle cx="1022" cy="257" r="19" fill="#e2f1ef"/>
  <text x="1022" y="262" text-anchor="middle" class="step" fill="#247b72">04</text>
  <text x="1052" y="254" class="card-title">Python 검증</text>
  <text x="1052" y="277" class="card-subtitle">Workflow Engine 01–07</text>
  <line x1="1010" y1="300" x2="1220" y2="300" stroke="#dfe8e5"/>
  <circle cx="1017" cy="332" r="5" fill="#247b72"/>
  <text x="1033" y="338" class="item">입력 구조화와 라우팅</text>
  <text x="1033" y="360" class="item-note">누락·모호성·방향 검증</text>
  <circle cx="1017" cy="397" r="5" fill="#247b72"/>
  <text x="1033" y="403" class="item">관계와 상태 검증</text>
  <text x="1033" y="425" class="item-note">schema·path·state transition</text>
  <circle cx="1017" cy="462" r="5" fill="#247b72"/>
  <text x="1033" y="468" class="item">완료 조건 확인</text>
  <text x="1033" y="490" class="item-note">Fulfillment와 deliverable</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="1295" y="210" width="250" height="315" rx="8" fill="#ffffff" stroke="#d6d0df"/>
  </g>
  <rect x="1295" y="210" width="250" height="8" rx="4" fill="#6b5e8c"/>
  <circle cx="1332" cy="257" r="19" fill="#eeeaf5"/>
  <text x="1332" y="262" text-anchor="middle" class="step" fill="#6b5e8c">05</text>
  <text x="1362" y="254" class="card-title">검토와 판단</text>
  <text x="1362" y="277" class="card-subtitle">Evidence-backed Review</text>
  <line x1="1320" y1="300" x2="1520" y2="300" stroke="#e6e1eb"/>
  <circle cx="1327" cy="332" r="5" fill="#6b5e8c"/>
  <text x="1343" y="338" class="item">근거와 산출물</text>
  <text x="1343" y="360" class="item-note">파일·요약·SHA-256 확인</text>
  <circle cx="1327" cy="397" r="5" fill="#6b5e8c"/>
  <text x="1343" y="403" class="item">상태 분리</text>
  <text x="1343" y="425" class="item-note">통과·근거 부족·보류</text>
  <circle cx="1327" cy="462" r="5" fill="#6b5e8c"/>
  <text x="1343" y="468" class="item">사용자 검토</text>
  <text x="1343" y="490" class="item-note">자동 판정과 별도 기록</text>

  <!-- Connectors -->
  <line x1="316" y1="340" x2="354" y2="340" stroke="#71817b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="326" text-anchor="middle" class="arrow-label">고정</text>
  <line x1="626" y1="340" x2="664" y2="340" stroke="#71817b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="326" text-anchor="middle" class="arrow-label">전달</text>
  <line x1="936" y1="340" x2="974" y2="340" stroke="#71817b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="326" text-anchor="middle" class="arrow-label">실행</text>
  <line x1="1246" y1="340" x2="1284" y2="340" stroke="#71817b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1265" y="326" text-anchor="middle" class="arrow-label">검토</text>

  <!-- Bottom contract band -->
  <rect x="55" y="570" width="1490" height="125" rx="8" fill="#ffffff" stroke="#d4ddda"/>
  <text x="82" y="607" class="eyebrow">끝까지 유지되는 세 가지 계약</text>

  <rect x="82" y="628" width="430" height="45" rx="7" fill="#e8f3ee"/>
  <circle cx="107" cy="650" r="7" fill="#277156"/>
  <text x="126" y="647" class="band-label">Source of Truth</text>
  <text x="126" y="666" class="band-copy">원문·Manifest·Evidence는 읽기 전용</text>

  <rect x="585" y="628" width="430" height="45" rx="7" fill="#fbefdd"/>
  <circle cx="610" cy="650" r="7" fill="#a7671f"/>
  <text x="629" y="647" class="band-label">Traceable Relationship</text>
  <text x="629" y="666" class="band-copy">Project·Session·Operation·Run을 식별자로 연결</text>

  <rect x="1088" y="628" width="430" height="45" rx="7" fill="#eeeaf5"/>
  <circle cx="1113" cy="650" r="7" fill="#6b5e8c"/>
  <text x="1132" y="647" class="band-label">Honest Completion</text>
  <text x="1132" y="666" class="band-copy">AI 완료 보고와 검증·사용자 확인을 분리</text>

  <text x="1545" y="731" text-anchor="end" class="item-note">Schema Workflow Operations Dashboard · Local-first · Evidence-backed</text>
</svg>
